name: Android - build, lint e testes
on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit tests
        run: sh gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
