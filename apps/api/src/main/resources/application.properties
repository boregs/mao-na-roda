spring.application.name=MaoNaRodaApi
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.show-actuator=true
spring.jdbc.template.query-timeout=2s
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.jackson.deserialization.fail-on-null-for-primitives=true
ors.api-key=${ORS_API_KEY:}
ors.geocoding-key=${ORS_GEOCODING_KEY:}
ors.routing-url=${ORS_ROUTING_URL:https://api.openrouteservice.org/v2/directions}
ors.geocoding-url=${ORS_GEOCODING_URL:https://api.openrouteservice.org/geocode/search}
auth.issuer=${AUTH_ISSUER:}
auth.jwk-set-uri=${AUTH_JWK_SET_URI:}
auth.audience=${AUTH_AUDIENCE:authenticated}
