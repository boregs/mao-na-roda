spring.application.name=MaoNaRodaApi
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.show-actuator=true

# Storage é opcional até a primeira operação.
supabase.storage.url=${SUPABASE_URL:}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:relato-fotos}
supabase.storage.timeout=5s
