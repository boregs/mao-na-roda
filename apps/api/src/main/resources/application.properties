spring.application.name=MaoNaRodaApi
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.show-actuator=true
spring.jdbc.template.query-timeout=2s
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.jackson.deserialization.fail-on-null-for-primitives=true
google.routes.api-key=${GOOGLE_ROUTES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
auth.issuer=${AUTH_ISSUER:}
auth.jwk-set-uri=${AUTH_JWK_SET_URI:}
auth.audience=${AUTH_AUDIENCE:authenticated}
