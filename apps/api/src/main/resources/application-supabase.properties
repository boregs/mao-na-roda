# Ativar com SPRING_PROFILES_ACTIVE=supabase.
# URL JDBC sem senha na URL; credenciais separadas do usuário de migrations.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${SUPABASE_DB_CA_CERT}
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.datasource.hikari.data-source-properties.ApplicationName=mao-na-roda-api
server.error.include-message=never
server.error.include-stacktrace=never
